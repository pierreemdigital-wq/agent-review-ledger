name: Feature request
description: Propose a focused improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful proposal
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Security boundary or non-goals affected
